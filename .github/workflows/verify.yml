name: verify

# This repository is a YAML catalogue, a shell script and a publish workflow, so
# it has no test container and nothing to build. What it does have is citations
# of decisions held in other repositories, and those go stale silently: once
# every repository numbers its records from 1, a citation that does not name its
# repository resolves to whichever record happens to share the number.
#
# `publish.yml` is the gate for the catalogue itself and refuses to publish
# something broken. This is the gate for the prose.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  records:
    name: Record citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository owns no decision records — every decision it implements
      # is enforced by a mechanism in another repository — so there is no index
      # to check. Only the citations are checked.
      - name: Every record citation names its repository
        run: python3 scripts/adr_lint.py --repo registry --exclude 'scripts/adr_*.py'
