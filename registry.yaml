# Mosaic's official extension-module registry — the source of truth for what the
# published index (ADR 0065) contains.
#
# The publish workflow reads this, digests each module's release binaries,
# builds a signed index, and deploys it to GitHub Pages. A module appears to
# every Platform that trusts this repository the moment it lands here and the
# index is republished.

repository:
  name: mosaic-official
  # The public base URL a Platform fetches the index from. GitHub Pages for this
  # repository. The Platform appends /index.json and /index.json.sig.
  url: https://mosaic-media.github.io/registry
  # The URL template each module binary is downloaded from, filled per module
  # and platform. Points at the module's OWN GitHub release assets — the binary
  # lives with the module, the signed catalogue lives here.
  binary_url_template: "https://github.com/mosaic-media/module-{id}/releases/download/{version}/module-{id}-{os}-{arch}"

# The catalogue. Empty until an extension module ships out-of-process binaries;
# an entry here whose module publishes only a Go module tag has no binary to
# point at, and the workflow refuses rather than publishing a broken index.
#
# The first real entry will be the Stremio addon source, which already has the
# main.go that lets it run as its own process — it needs a release that
# cross-compiles and signs binaries (host/v0.2.0-based), which is the change its
# release.yml takes when it moves out of process.
modules: []
  # - id: stremio-addons
  #   version: v0.24.0
  # - id: aiostreams
  #   version: v0.3.0
  # - id: fanart-tv
  #   version: v0.3.0
