# Mosaic's official extension-module registry — the source of truth for what the
# published index (ADR 0065) contains.
#
# The publish workflow reads this, downloads each catalogued module's own
# manifest — unsigned; the index signature over it is what authenticates the
# manifest and the digests it carries — builds a signed index over them, and
# deploys it to GitHub Pages. A
# module appears to every Platform that trusts this repository the moment it
# lands here and the index is republished.

repository:
  name: mosaic-official
  # The public base URL a Platform fetches the index from. GitHub Pages for this
  # repository. The Platform appends /index.json and /index.json.sig.
  url: https://mosaic-media.github.io/registry
  # No binary URL template here: a module's binary URLs live in its own
  # manifest.json, which it publishes and which the registry only aggregates.
  # The module knows where it hosts its bytes — its repository name need not
  # match its module id — so the URL is its to declare, not the registry's to
  # compute.

# The catalogue. Each entry names the GitHub repository (under mosaic-media) that
# publishes the module and the release tag to catalogue; the registry fetches
# that release's manifest.json and the manifest is authoritative for everything
# else — the module id, its roles, its binaries' URLs and digests. The repo is
# named outright because it does not follow from the module id: the repository
# module-stremio-addons publishes a module whose id is "stremio".
#
# A repo whose release publishes no manifest.json (a Go module tag alone) has no
# binary to point at, and the workflow refuses rather than publishing a broken
# index.
modules:
  - repo: module-stremio-addons
    version: v0.30.0
  - repo: module-aiostreams
    version: v0.8.0
  - repo: module-fanart-tv
    version: v0.7.0
